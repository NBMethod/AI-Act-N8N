name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The same scan n8n runs during verification. Failing here is cheaper
      # than failing in the Creator Portal queue.
      - name: Community package scan
        run: npx --yes @n8n/scan-community-package .
        continue-on-error: true
