name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing : GitHub émet un jeton OIDC que npm vérifie contre
      # le « trusted publisher » configuré sur le paquet (NBMethod/AI-Act-N8N,
      # publish.yml). Plus aucun NPM_TOKEN à créer ni à renouveler. La
      # provenance est générée automatiquement par ce chemin.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing exige npm ≥ 11.5.1 ; Node 22 embarque npm 10.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      # Pas de NODE_AUTH_TOKEN : l'authentification passe par OIDC.
      - name: Publish with provenance
        run: npm publish --access public
